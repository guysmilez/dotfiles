# theme.yml
#
# SynthWave '84
# https://github.com/robb0wen/synthwave-vscode
#
# Designed for dark terminals.
#
# Palette:
#   background      #262335  (terminal background; not set by eza)
#   foreground      #f0eff1
#   pink            #ff7edb
#   cyan            #03edf9
#   bright_cyan     #36f9f6
#   green           #72f1b8
#   yellow          #fede5d
#   red             #fe4450
#   orange          #ff8b39
#   purple          #c792ea
#   blue            #848bbd
#   dim             #7b6a98

colourful: true

filekinds:
  normal:
    foreground: "#f0eff1"

  directory:
    foreground: "#36f9f6"
    is_bold: true

  symlink:
    foreground: "#ff7edb"
    is_italic: true

  pipe:
    foreground: "#848bbd"

  block_device:
    foreground: "#fede5d"

  char_device:
    foreground: "#fede5d"

  socket:
    foreground: "#ff7edb"

  special:
    foreground: "#c792ea"

  executable:
    foreground: "#72f1b8"
    is_bold: true

  mount_point:
    foreground: "#36f9f6"
    is_bold: true

perms:
  user_read:
    foreground: "#36f9f6"

  user_write:
    foreground: "#fede5d"

  user_execute_file:
    foreground: "#72f1b8"

  user_execute_other:
    foreground: "#72f1b8"

  group_read:
    foreground: "#03edf9"

  group_write:
    foreground: "#fede5d"

  group_execute:
    foreground: "#72f1b8"

  other_read:
    foreground: "#03edf9"

  other_write:
    foreground: "#fede5d"

  other_execute:
    foreground: "#72f1b8"

  special_user_file:
    foreground: "#ff7edb"

  special_other:
    foreground: "#fe4450"

  attribute:
    foreground: "#7b6a98"

size:
  major:
    foreground: "#c792ea"

  minor:
    foreground: "#848bbd"

  number_byte:
    foreground: "#f0eff1"

  number_kilo:
    foreground: "#03edf9"

  number_mega:
    foreground: "#36f9f6"

  number_giga:
    foreground: "#c792ea"

  number_huge:
    foreground: "#ff7edb"

  unit_byte:
    foreground: "#7b6a98"

  unit_kilo:
    foreground: "#03edf9"

  unit_mega:
    foreground: "#36f9f6"

  unit_giga:
    foreground: "#c792ea"

  unit_huge:
    foreground: "#ff7edb"

users:
  user_you:
    foreground: "#72f1b8"
    is_bold: true

  user_root:
    foreground: "#fe4450"
    is_bold: true

  user_other:
    foreground: "#c792ea"

  group_yours:
    foreground: "#03edf9"

  group_other:
    foreground: "#848bbd"

  group_root:
    foreground: "#fe4450"

links:

    foreground: "#ff7edb"

  multi_link_file:
    foreground: "#c792ea"

git:
  new:
    foreground: "#72f1b8"

  modified:
    foreground: "#fede5d"

  deleted:
    foreground: "#fe4450"

  renamed:
    foreground: "#03edf9"

  typechange:
    foreground: "#c792ea"

  ignored:
    foreground: "#7b6a98"
